name: go-mall

# ============================================================
# 阶段二：基础设施（MySQL + Redis）
# 业务服务在阶段十一加入本文件
# 启动：docker compose up -d mysql redis
# 监控：docker compose --profile monitoring up -d
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: mall-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?}
      CART_DB_PASSWORD: ${CART_DB_PASSWORD:?}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      # 只绑定回环地址，避免把数据库暴露到局域网
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - mall-net

  redis:
    image: redis:7-alpine
    container_name: mall-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - mall-net

  # 可选：只做指标抓取，不接 Grafana。不加 --profile 时不会启动
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: mall-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - mall-net

networks:
  mall-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
