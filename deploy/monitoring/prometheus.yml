global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 阶段十一业务服务加入 compose 后，这些 target 才会变为 UP
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: user
    static_configs:
      - targets: ["user:8081"]

  - job_name: product
    static_configs:
      - targets: ["product:8082"]

  - job_name: cart
    static_configs:
      - targets: ["cart:8083"]

  - job_name: order
    static_configs:
      - targets: ["order:8084"]

  - job_name: payment
    static_configs:
      - targets: ["payment:8085"]
